spring.application.name=erp-inventory-api
server.port=8080

spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver
spring.datasource.url= jdbc:mysql://localhost:3306/erp-modernization
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Learning only: convenient H2 console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Helpful while learning; turn off noisy SQL logs later.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
